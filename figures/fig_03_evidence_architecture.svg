   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #18344a" transform="translate(38.8944 235.387986)">两层架构：编排层（AgentScope 2.0）负责自主决策与工具调用；数据/审计层为自研 Python 流水线（标准库），各阶段保留中间产物。</text>
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #18344a" transform="translate(38.8944 248.64883)">确定性审计 evaluate/compare 为纯标准库、零 LLM 零网络、不经过编排层；增量原则不破（id 续编、不覆盖历史记录）。</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #85939f" x="38.8944" y="432.76507" transform="rotate(-0 38.8944 432.76507)">边界：Materials Project 仅提供结构/热力学背景；无条目表示数据库覆盖缺口，不验证合成路线、稳定性或新颖性。</text>
   </g>
