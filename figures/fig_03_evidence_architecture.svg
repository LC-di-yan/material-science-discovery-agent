   <g id="text_1">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; text-anchor: start; fill: #85939f" x="7.2" y="30.681547" transform="rotate(-0 7.2 30.681547)">编排层 = AgentScope 2.0（discover 循环）；数据/审计层 = 自研 Python 流水线；模块可独立重跑</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans'; fill: #ffffff" transform="translate(243.811036 68.095361)">编排层 · AgentScope 2.0（agent/agentic.py，Apache-2.0）</text>
